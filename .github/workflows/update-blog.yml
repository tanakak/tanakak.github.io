name: Update note blog feed

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 6:17（日本時間）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_note.py
      - .github/workflows/update-blog.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_note.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain blog.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blog.json
            git commit -m "Update note blog feed"
            git push
          else
            echo "変更なし"
          fi
